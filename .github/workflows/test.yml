name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 23+ is required for the end-to-end test, which imports the extension's
          # TypeScript directly instead of keeping a second build artifact in sync.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
